name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_API: ghcr.io/${{ github.repository }}-api

jobs:
  build-app:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=app-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}

  merge-app:
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE }}:${{ github.sha }}-arm64

  build-api:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_API }}:${{ github.sha }}-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
          cache-from: type=gha,scope=api-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.runner == 'ubuntu-latest' && 'amd64' || 'arm64' }}

  merge-api:
    needs: build-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE_API }}:latest \
            --tag ${{ env.IMAGE_API }}:${{ github.sha }} \
            ${{ env.IMAGE_API }}:${{ github.sha }}-amd64 \
            ${{ env.IMAGE_API }}:${{ github.sha }}-arm64

  deploy:
    needs: [merge-app, merge-api]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/payslip
            test -f .env || { echo "ERROR: /opt/payslip/.env is missing. Create it before deploying."; exit 1; }
            git fetch origin
            git reset --hard origin/main
            docker compose pull app api
            docker compose up -d --remove-orphans
            docker compose restart caddy
            docker image prune -f
