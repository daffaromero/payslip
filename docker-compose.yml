services:
  app:
    image: ghcr.io/daffaromero/payslip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/payslip.db
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@contoh.co.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_TOKEN: ${SEED_TOKEN:-}
      WA_SESSION_DIR: /data/whatsapp-session
      UPLOAD_DIR: /data/uploads/logos
      NODE_ENV: production
    volumes:
      - payslip_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  payslip_data:
  caddy_data:
  caddy_config:
