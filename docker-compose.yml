services:
  app:
    image: ghcr.io/daffaromero/payslip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/payslip.db
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    volumes:
      - payslip_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    image: ghcr.io/daffaromero/payslip-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/payslip.db
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@contoh.co.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_TOKEN: ${SEED_TOKEN:-}
      WA_SESSION_DIR: /data/whatsapp-session
      UPLOAD_DIR: /data/uploads/logos
      EXPORT_DIR: /data/exports
      FRONTEND_URL: https://${DOMAIN}
      NODE_ENV: production
      PORT: 3001
    volumes:
      - payslip_data:/data
    expose:
      - "3001"
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api

volumes:
  payslip_data:
  caddy_data:
  caddy_config:
